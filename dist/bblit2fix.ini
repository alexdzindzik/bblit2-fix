; BBLIT2 Fix - Pernalonga e Taz: O Furacao do Tempo
; Para desligar tudo: enabled=0 (ou apague dinput.dll da pasta bin).
; O log de cada execucao fica em bblit2fix.log, nesta mesma pasta.

[fix]
enabled=1
; 1 = registra as primeiras chamadas de video no log (ajuda no diagnostico)
log_gl=1
; 1 = log detalhado (arquivos abertos, sinal de vida da thread principal)
;     e teclas de comparacao: F9 = distancias originais x mod, F11 = efeitos de imagem,
;     F8 = finge controle desconectado / conectado / real (testa os icones dos botoes),
;     e nos menus do inicio I/K/J/L/U/O fazem as vezes de direcional, A e B do controle
; 2 = tambem registra cada textura enviada (muito texto; so para diagnostico)
debug=0
; 1 = grava as texturas carregadas em texdump.bin, com a assinatura usada pela lista HD (deixe 0)
dump_textures=0

[video]
; 1 = o jogo continua rodando quando voce clica em outra janela/monitor (sem minimizar e recriar a tela)
; 0 = comportamento original (o jogo se suspende ao perder o foco)
background=1
; 2 = widescreen: o jogo ocupa a tela inteira e mostra mais cenario dos lados (Hor+), sem esticar
;     (menus 2D continuam 4:3 no centro)
; 1 = imagem 4:3 centralizada, com barras pretas
; 0 = estica para a tela inteira, como o jogo faz sozinho
aspect=2
; telas 2D (menu inicial, configuracao, aberturas):
;   3 = 16:9 de verdade: o fundo (aneis ou cor lisa) continua ate as bordas, sem esticar nada
;       (fundo que o mod nao reconhece usa o 1)
;   1 = laterais com o fundo desfocado   2 = esticadas para a tela inteira   0 = barras pretas
menu_fill=3
; imagens HD dos menus (pasta hd ao lado do mod, gerada pelo tools\hd_menu\make_pack.py):
; icones e fundos ampliados 4x e, se o pacote tiver, a tela inicial com o azul escuro. 0 = ignora a pasta
menu_hd=1
; 1 = menus 2D desenhados direto em alta resolucao (letras nitidas); 0 = 640x480 ampliado
hires_menu=1
; 1 = letras, HUD e desenhos do jogo redesenhados em 4x com contorno liso (xBR), feito na hora pelo mod
;     as texturas sao reconhecidas pelo desenho, nao pelas cores: funciona com qualquer "Brilho" do menu Video
;     (lista extra opcional: bblit2fix_hd.txt nesta pasta, uma assinatura hexadecimal por linha, do texdump.bin)
; dica: o "Brilho" do menu Video do jogo realca so as cores das texturas; acima do meio (~43%) os rostos
;       ficam manchados (pele de uma cor, sobrancelhas de outra). Para cores mais vivas, use [postfx] abaixo.
hd_textures=1
; anti-serrilhado das bordas (MSAA): 0, 2, 4 ou 8
msaa=4
; supersampling: o jogo e desenhado internamente N vezes maior e reduzido (1 = desligado, 2 = 2x, max. 4)
; suaviza tambem folhagens, cercas e texturas recortadas
supersampling=2
; mipmaps nas texturas filtradas (menos "chuvisco" ao longe) e filtro anisotropico (1, 2, 4, 8 ou 16)
mipmaps=1
anisotropy=16
; distancia de visao, em % do original (100 = original, 200 = o dobro; maximo 400)
; soma-se ao "Nivel de Detalhes" do menu de video do jogo (deixe em Alto)
draw_distance=400
; distancia em que itens, objetos e personagens aparecem, em % do original (100 = original, maximo 400)
object_distance=200
; LOD dos modelos: ate onde personagens e objetos mantem o modelo detalhado antes de trocar pelo
; simplificado, em % do original (100 = original, maximo 1000)
lod_distance=400
; 1 = se o PC nao segurar 30 fps, reduz o anti-serrilhado sozinho (registrado no log)
auto_quality=1
; sincronia vertical: 1 = ligada, 0 = desligada, -1 = nao mexe
vsync=1
; 1 = sempre usa OpenGL (as melhorias do mod dependem dele). Se uma execucao travar na abertura, o jogo
;     sozinho cai para Direct3D/software na vez seguinte; com 1 ele tenta OpenGL de novo.
force_opengl=1

[postfx]
; efeitos de imagem aplicados pelo mod no fim de cada quadro (0 = desliga todos)
enabled=1
; brilho suave em volta das partes mais claras (bloom): 0 = desligado ... 100 = forte
bloom=25
; a partir de que claridade o bloom age: 0 ... 100 (maior = so as partes bem claras)
bloom_threshold=70
; nitidez adaptativa (CAS): 0 = desligada ... 100 = maxima
sharpen=40
; saturacao das cores, em % (100 = original)
saturation=110
; contraste, em % (100 = original)
contrast=105
; vinheta (cantos levemente escurecidos): 0 = desligada ... 100 = forte
vignette=20

[pad]
; controle Xbox/XInput vira as teclas configuradas no jogo
xinput=1
; zona morta do analogico esquerdo, em %
deadzone=30
; A tambem funciona como Enter (menus e mensagens)
a_is_enter=1
; analogico direito gira a camera (alem de LT/RT)
right_stick_camera=1
; inverte o giro da camera: 1 = invertido, 0 = como as teclas Q/W do jogo
invert_camera_stick=1
invert_camera_triggers=1
; troca A e B
swap_ab=0
; com o controle conectado, as dicas do jogo mostram os botoes do Xbox no lugar das teclas:
; 2 = icones dos botoes, 1 = nomes (A, B, LB...), 0 = sempre as teclas
; (trocam na hora ao conectar ou desconectar o controle)
button_prompts=2
; menus do inicio (1 jogador, carregar, configuracao), que o jogo so deixa usar com o mouse:
; 1 = direcional/analogico pula entre os itens, A ou Start confirma, B volta   0 = so mouse
menu_navigation=1
; Start = Esc (pausa)   Back = F4 (menu anterior)
; 1 = libera o suporte a joystick DirectInput original do jogo no Windows 10/11
; (deixe 0 se usar o controle Xbox pelo xinput=1, para nao dar comando em dobro)
unlock_dinput_joystick=0

[game]
; idioma: -1 = detecta pelas falas do CD (PT-BR = 5); 0 = ingles ... 5 = portugues
language=-1
